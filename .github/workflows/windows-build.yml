name: Build Python EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install `
            # Packaging
            pyinstaller `
            # HTTP & Web
            requests `
            httpx `
            aiohttp `
            # Data & Science
            numpy `
            pandas `
            scipy `
            scikit-learn `
            matplotlib `
            seaborn `
            # Database
            sqlalchemy `
            # Config & Environment
            python-dotenv `
            pydantic `
            pydantic-settings `
            # CLI
            click `
            rich `
            typer `
            # File Handling
            openpyxl `
            pillow `
            PyPDF2 `
            python-docx `
            # Serialization
            orjson `
            pyyaml `
            toml `
            # Utilities
            tqdm `
            loguru `
            tenacity `
            schedule `
            # Async
            anyio `
            # Testing (optional, remove if not needed in the exe)
            pytest


      - name: Find main.py and build EXE with PyInstaller
        shell: pwsh
        run: |
          # Look for main.py in root first, then any immediate subfolder
          if (Test-Path "main.py") {
            $entrypoint = "main.py"
            Write-Host "Found main.py in root"
          } else {
            $found = Get-ChildItem -Depth 1 -Filter "main.py" | Select-Object -First 1
            if ($found) {
              $entrypoint = $found.FullName
              Write-Host "Found main.py at: $entrypoint"
            } else {
              Write-Error "Could not find main.py in root or any immediate subfolder."
              exit 1
            }
          }

          pyinstaller `
            --onefile `
            --clean `
            --name "MyApp" `
            --hidden-import=pkg_resources.py2_warn `
            $entrypoint
          # Add --noconsole if building a GUI app (no terminal window)
          # Add --icon=app.ico to set a custom icon

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-windows-exe
          path: dist/MyApp.exe
          retention-days: 30

      # Optional: create a GitHub Release on version tags
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MyApp.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
