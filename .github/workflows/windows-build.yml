name: Build Python EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: ""

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install `
            pyinstaller `
            mss `
            opencv-python `
            numpy `
            pillow `
            requests `
            httpx `
            aiohttp `
            pandas `
            sqlalchemy `
            python-dotenv `
            pydantic `
            pydantic-settings `
            click `
            rich `
            openpyxl `
            PyPDF2 `
            python-docx `
            pyyaml `
            toml `
            tqdm `
            loguru `
            tenacity `
            schedule `
            anyio

      - name: Install project requirements (if present)
        shell: pwsh
        run: |
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

      - name: Find main.py and build EXE with PyInstaller
        shell: pwsh
        run: |
          if (Test-Path "main.py") {
            $entrypoint = "main.py"
            Write-Host "Found main.py in root"
          } else {
            $found = Get-ChildItem -Depth 1 -Filter "main.py" | Select-Object -First 1
            if ($found) {
              $entrypoint = $found.FullName
              Write-Host "Found main.py at: $entrypoint"
            } else {
              Write-Error "Could not find main.py in root or any immediate subfolder."
              exit 1
            }
          }

          pyinstaller `
            --onefile `
            --noconsole `
            --clean `
            --name "ScreenRecorder" `
            --hidden-import=pkg_resources.py2_warn `
            --hidden-import=cv2 `
            --hidden-import=mss `
            --hidden-import=mss.windows `
            $entrypoint

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-windows-exe
          path: dist/ScreenRecorder.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ScreenRecorder.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
